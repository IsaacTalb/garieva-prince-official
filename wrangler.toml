name = "garieva-prince"
main = ".open-next/worker.js"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Local D1 binding. Replace database_id with the ID from `wrangler d1 create`
# before deploying to a Cloudflare account.
[[d1_databases]]
binding = "DB"
database_name = "garieva-prince-dev"
database_id = "00000000-0000-0000-0000-000000000000"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "garieva-prince"

[images]
binding = "IMAGES"

[vars]
NODE_ENV = "development"
DATABASE_URL = "cloudflare:D1:garieva-prince-dev"

[env.production]
name = "garieva-prince-prod"

[[env.production.d1_databases]]
binding = "DB"
database_name = "garieva-prince-prod"
database_id = "00000000-0000-0000-0000-000000000000"

[env.production.vars]
NODE_ENV = "production"
DATABASE_URL = "cloudflare:D1:garieva-prince-prod"